name: Bug
description: A reproducible bug in the demo or product
title: "Bug · "
labels: []
body:
  - type: textarea
    id: steps
    attributes:
      label: Input and steps
      placeholder: "Offline mode, leave the field empty, click Find a room."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: Include error message, screenshot or output. No keys.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Branch, commit and machine
      description: Shown in python tools/setup.py output.
      placeholder: "main @ 5276e22, macOS 15"
    validations:
      required: true
