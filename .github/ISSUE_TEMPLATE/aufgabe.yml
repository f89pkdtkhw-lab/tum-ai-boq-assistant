name: Team task
description: A claimable task with a verifiable result, for people and coding agents
title: "Task · "
body:
  - type: markdown
    attributes:
      value: |
        `python tools/aufgabe.py <number>` creates a separate branch, worktree and assignment for Claude Code, Codex or Antigravity. When scope, acceptance test and target branch are complete, add `agent-bereit`.
  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: GitHub login
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Outcome and acceptance test
      description: Which input produces which verifiable result, and where?
      placeholder: "For 5 people in offline mode, the UI shows Isar with 6 seats."
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Scope
      description: Files or folders this task may change. No two open tasks share a file.
      placeholder: "api/app/pruefung/regeln.py, api/tests/test_regeln.py"
    validations:
      required: true
  - type: dropdown
    id: base
    attributes:
      label: Target branch
      options:
        - main
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - any
        - Claude Code
        - Codex
        - Antigravity
        - Jules
        - manually
    validations:
      required: false
  - type: textarea
    id: interface
    attributes:
      label: Interfaces and dependencies
      description: Shared fields or formats that change, and issues this task depends on.
    validations:
      required: false
