name: Demo-Stand
# The jury URL (Vercel production) follows demo. This workflow promotes main to demo only
# when tests and product build on main pass. If main is red, demo stays on the last green revision
# and an @all alarm is posted on the team board. The alarm closes when main is green again.
on:
  workflow_run:
    workflows: ["Team-Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: demo-stand
  cancel-in-progress: false

jobs:
  befoerdern:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check revision, promote or alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          board=$(python3 -c "import json; print(json.load(open('tools/board.json'))['issue'])")
          short=${SHA:0:7}
          if [ -n "${RUN_ID:-}" ]; then
            # Only required jobs count; Windows/macOS runs must not block the demo.
            failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.name=="test" or .name=="produkt") | select(.conclusion!="success")] | length')
            total=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.name=="test" or .name=="produkt")] | length')
          else
            failed=0; total=1
          fi
          alarm=$(gh issue list -R "$REPO" --label main-rot --state open --json number --jq '.[0].number // empty')
          if [ "$total" -gt 0 ] && [ "$failed" -eq 0 ]; then
            git fetch -q origin demo 2>/dev/null || true
            if git rev-parse -q --verify origin/demo >/dev/null && ! git merge-base --is-ancestor origin/demo "$SHA"; then
              echo "::warning::demo is not an ancestor of $short; skipping promotion."; exit 0
            fi
            git push origin "$SHA:refs/heads/demo"
            echo "✓ demo is now at $short"
            if [ -n "$alarm" ]; then
              gh issue close "$alarm" -R "$REPO" --comment "main is green again ($short); demo updated."
              gh issue comment "$board" -R "$REPO" --body "[CI · Watcher] main is green again. The demo now shows $short."
            fi
          else
            echo "✗ main is red at $short; demo stays unchanged."
            if [ -z "$alarm" ]; then
              author=$(gh api "repos/$REPO/commits/$SHA" --jq '.author.login // .commit.author.name')
              title=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message | split("\n")[0]')
              demo=$(git rev-parse --short origin/demo 2>/dev/null || echo "–")
              gh issue create -R "$REPO" --label main-rot --label blocker --title "main is red: $short" \
                --body "Tests or product build on main have failed since $short (“$title”, @$author). The live demo stays at $demo. Run: ${{ github.server_url }}/$REPO/actions/runs/${RUN_ID:-}"
              gh issue comment "$board" -R "$REPO" --body "[CI · Watcher] @all main is red since $short (“$title”, @$author). The demo stays at $demo. Do not merge until the author fixes or reverts it."
            fi
          fi
