name: Claude-Agent
# Starts Claude Code in GitHub Actions when someone with write access
#   - writes @claude in an issue or pull request, or
#   - adds the "claude" label to an issue.
# One-time setup (see docs/agenten.md): repository secret CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`) or ANTHROPIC_API_KEY. Without a secret, the run is skipped.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Check credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY configured; Claude agent skipped. Setup in docs/agenten.md."
      - uses: actions/checkout@v7
        if: env.HAS_CREDENTIALS == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        if: env.HAS_CREDENTIALS == 'true'
        with:
          python-version: "3.11"
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CREDENTIALS == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(python -m unittest:*),Bash(python tools/agents_sync.py:*),Bash(git:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
