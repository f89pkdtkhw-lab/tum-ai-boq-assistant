name: Team-Checks
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push auf denselben Branch bricht den alten Lauf ab und spart Actions-Minuten.
concurrency:
  group: team-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Schnell und günstig für jeden Pull Request.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Tests ausführen
        run: python -m unittest discover -s tests -v

  # Das Wettbewerbsprodukt: Backend-Tests und Build der Oberfläche.
  produkt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Backend-Tests
        working-directory: api
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Oberfläche bauen
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # Windows und macOS kosten im privaten Repo 2- bzw. 10-mal so viele Minuten.
  # Deshalb nur nach dem Merge auf die gemeinsamen Branches oder per Hand.
  plattformen:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests ausführen
        run: python -m unittest discover -s tests -v
