name: Team-Checks
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the old run and saves Actions minutes.
concurrency:
  group: team-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast and inexpensive for every pull request.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # tests/test_pdf.py imports api.app.lv.pdf, which needs the api packages.
      - name: Install api requirements
        run: pip install -q -r api/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  # The competition product: backend tests and UI build.
  produkt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Backend tests
        working-directory: api
        env:
          # api/app/main.py imports the top-level db package from the repo root.
          PYTHONPATH: ..
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # Windows and macOS cost 2x and 10x as many minutes in a private repository.
  # Run them only after merging to shared branches or on manual request.
  plattformen:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
