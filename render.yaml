# Öffentliches Backend auf Render (Blueprint): render.com → New → Blueprint → dieses Repo.
# Schlüssel trägt ihr im Render-Dashboard als Environment Variables ein, nie hier.
services:
  - type: web
    name: boq-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_ORIGINS
        sync: false
